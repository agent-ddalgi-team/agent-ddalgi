<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회사소개서 초안 도우미</title>
<style>
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    max-width: 800px;
    margin: 24px auto;
    padding: 0 16px;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
  section {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  section h2 { font-size: 15px; margin: 0 0 10px 0; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #444; }
  input[type="file"], input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  #fileList {
    list-style: none;
    padding: 0;
    margin: 8px 0 0 0;
    font-size: 13px;
  }
  #fileList li {
    padding: 4px 8px;
    background: #f0f0f0;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  #fileList:empty::before {
    content: "선택한 파일이 없습니다.";
    color: #999;
  }
  button {
    margin-top: 12px;
    padding: 10px 16px;
    border: none;
    border-radius: 4px;
    background: #2563eb;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    background: #bbb;
    cursor: not-allowed;
  }
  #statusArea {
    font-size: 13px;
    color: #333;
    min-height: 18px;
  }
  #errorArea {
    font-size: 13px;
    color: #c0392b;
    min-height: 18px;
    white-space: pre-wrap;
  }
  .mock-badge {
    display: inline-block;
    font-size: 11px;
    color: #b45309;
    background: #fef3c7;
    border: 1px solid #f59e0b;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
  }
  .field-status {
    font-size: 11px;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
  }
  .status-supported { background: #dcfce7; color: #166534; }
  .status-conflict { background: #fee2e2; color: #991b1b; }
  .status-needs_confirmation { background: #fef9c3; color: #854d0e; }
  .status-not_found { background: #f1f5f9; color: #64748b; }
  #companyInfoArea > div, #draftArea > div { margin-bottom: 10px; }
  #companyInfoArea .field-title, #draftArea .field-title { font-weight: bold; font-size: 13px; }
  #companyInfoArea ul, #draftArea ul, #confirmArea ul, #sourcesArea ul {
    margin: 4px 0; padding-left: 18px; font-size: 13px;
  }
</style>
</head>
<body>

<h1>회사소개서 초안 도우미</h1>
<div class="subtitle">내부 검토용 · 담당자 확인 전 대외 사용 금지</div>

<!-- 1. 파일 선택 영역 -->
<section>
  <h2>1. 자료 파일 선택</h2>
  <label for="fileInput">TXT/MD 파일 선택 (최대 3개)</label>
  <input type="file" id="fileInput" accept=".txt,.md" multiple>
  <ul id="fileList"></ul>
</section>

<!-- 2. 회사명 힌트 + 생성 버튼 -->
<section>
  <h2>2. 회사명 힌트 및 생성</h2>
  <label for="companyHint">회사명 힌트 (선택)</label>
  <input type="text" id="companyHint" placeholder="예: 테스트 회사">
  <button id="generateBtn">회사소개서 생성</button>
</section>

<!-- 2-1. 테스트용 Mock 결과 불러오기 (서버 연결 전 시험용) -->
<section>
  <h2>테스트용 Mock 결과 불러오기</h2>
  <label for="mockInput">fixtures/mock_job_ready.json 또는 fixtures/mock_job_error.json 선택</label>
  <input type="file" id="mockInput" accept=".json">
</section>

<!-- 3. 처리 상태 / 오류 -->
<section>
  <h2>3. 처리 상태</h2>
  <div id="statusArea"></div>
  <div id="errorArea"></div>
</section>

<!-- 4. 결과 영역 -->
<section>
  <h2>4. 결과 <span id="mockBadge" class="mock-badge" hidden>테스트 데이터</span></h2>

  <h3>회사 정보</h3>
  <div id="companyInfoArea"></div>

  <h3>소개서 본문</h3>
  <div id="draftArea"></div>

  <h3>확인 질문</h3>
  <div id="confirmArea"></div>

  <h3>근거 자료</h3>
  <div id="sourcesArea"></div>
</section>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
